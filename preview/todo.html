<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-do Preview</title>
  <style>
    /* Stand-ins for the app's tokens, so the to-do styles from lib/client.js
       render as in the app. The markup mirrors TodoWidget. URL:
       ?mode=bar|rail  ?nobill  ?empty  ?closed  ?at=<ms> freezes every animation
       at that time  ?shot hides the controls  #dark */
    body {
      --dsw-font-family: -apple-system, "PingFang SC", sans-serif;
      --dsw-radius-xs: 2px; --dsw-radius-md: 6px;
      --dsw-static-deepseek-500: #e46f24;
      --dsw-alias-bg-base: #fbfaf7;
      --dsw-alias-label-primary: #12110f; --dsw-alias-label-secondary: #5f5c56; --dsw-alias-label-tertiary: #949087;
      --dsw-alias-border-l2: rgba(18, 17, 15, .12); --dsw-alias-border-l3: rgba(18, 17, 15, .22);
      --dsw-alias-interactive-bg-hover: rgba(18, 17, 15, .05);
      --side: #f3f1ec;
      margin: 0; height: 100vh; background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary);
      font: 13px/1.5 var(--dsw-font-family);
    }
    body[data-ds-dark-theme] {
      --dsw-static-deepseek-500: #f0893e; --dsw-alias-bg-base: #1d1c1a;
      --dsw-alias-label-primary: #f6f5f1; --dsw-alias-label-secondary: #aca89e; --dsw-alias-label-tertiary: #7d7971;
      --dsw-alias-border-l2: rgba(255, 255, 255, .1); --dsw-alias-border-l3: rgba(255, 255, 255, .2);
      --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, .06);
      --side: #171614;
    }
    .app { display: flex; height: 100vh; }
    .side { flex: none; width: 260px; display: flex; flex-direction: column; background: var(--side); border-right: .5px solid var(--dsw-alias-border-l2); }
    body[data-mode=rail] .side { width: 52px; align-items: center; }
    .side ul { flex: 1; margin: 0; padding: 14px 8px; list-style: none; }
    .side li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--dsw-alias-label-secondary); white-space: nowrap; overflow: hidden; }
    .side li i { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--dsw-alias-border-l3); }
    .side li i.w { background: var(--dsw-static-deepseek-500); }
    .side li i.d { background: #a5c22a; }
    body[data-mode=rail] .side li { display: none; }
    .foot { display: flex; width: 100%; }
    body[data-mode=rail] .foot { justify-content: center; width: auto; }
    .settings { height: 36px; border-top: .5px solid var(--dsw-alias-border-l2); }
    /* Busy conversation area so the frosted panel has something to blur. */
    .main { position: relative; flex: 1; background: url(../assets/bars-light.jpg) right center / cover; }
    body[data-ds-dark-theme] .main { background-image: url(../assets/bars-dark.jpg); }
    .main p { position: absolute; left: 48px; top: 120px; width: 460px; margin: 0; font-size: 15px; line-height: 1.7; color: var(--dsw-alias-label-secondary); }
    .ctl { position: fixed; right: 16px; top: 16px; z-index: 2000; display: flex; gap: 6px; }
    .ctl a { font: inherit; padding: 4px 10px; border: 1px solid var(--dsw-alias-border-l2); border-radius: 6px; color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <ul>
        <li><i class="w"></i>排查构建失败</li>
        <li><i class="w"></i>迁移方案评审</li>
        <li><i class="w"></i>数据清洗脚本</li>
        <li><i class="d"></i>整理周报素材</li>
        <li><i></i>翻译 README</li>
        <li><i></i>重构计费模块</li>
        <li><i></i>旧方案对比</li>
      </ul>
      <div class="foot" id="foot"></div>
      <div class="settings"></div>
    </aside>
    <main class="main"><p>莱茵生命 · 研究档案 RL-DSH/0.2 · 终端已就绪。这段文字和板条阵列只是为了让待办面板背后有内容，便于检查毛玻璃的透明与模糊效果。DEEPSEEK HARNESS INTERNAL TERMINAL</p></main>
  </div>
  <div class="ctl" id="ctl"></div>
  <script>
    const params = new URLSearchParams(location.search)
    const mode = params.get('mode') === 'rail' ? 'rail' : 'bar'
    const empty = params.has('empty')
    document.body.dataset.mode = mode
    if (location.hash === '#dark') document.body.setAttribute('data-ds-dark-theme', '')
    const groups = empty ? { pending: [], done: [], running: [] } : {
      pending: [
        { title: '排查构建失败', status: '等待授权 · Bash', time: '2 分钟' },
        { title: '迁移方案评审', status: '计划待审', time: '4 分钟' },
        { title: '推理强度滑块的点阵特效参考实现方式', status: '等待回答', time: '9 分钟', current: true },
      ],
      done: [{ title: '整理周报素材', status: '运行结束', time: '刚刚' }],
      running: [
        { title: '翻译 README', status: '运行中', time: '12 分钟' },
        { title: '重构计费模块', status: '运行中', time: '' },
      ],
    }
    const count = groups.pending.length + groups.done.length
    const tone = groups.pending.length ? 'pending' : groups.done.length ? 'done' : 'idle'
    const labels = { pending: '等你处理', done: '已完成未查看', running: '运行中' }
    const el = (tag, attrs = {}, children = []) => {
      const node = document.createElement(tag)
      for (const [key, value] of Object.entries(attrs)) if (value !== undefined) key === 'text' ? node.textContent = value : node.setAttribute(key, value)
      node.append(...children)
      return node
    }
    // Pull the CSS array straight out of lib/client.js so this page never
    // drifts from the shipped styles.
    fetch('../lib/client.js').then((r) => r.text()).then((src) => {
      const css = src.slice(src.indexOf('const CSS = [') + 'const CSS = '.length, src.indexOf('].join("");') + 1)
      const style = document.createElement('style')
      style.textContent = new Function(`return ${css}`)().join('')
      document.head.append(style)

      const foot = document.getElementById('foot')
      const trigger = el('button', { type: 'button', class: 'rl-todo-btn', 'data-mode': mode, 'data-tone': tone,
        'data-running': groups.running.length ? 'true' : undefined, 'data-open': params.has('closed') ? undefined : 'true',
        'aria-label': `打开待办 · ${count} 项待处理` }, mode === 'rail' ? [
          el('span', { class: 'rl-todo-btn-icon', 'aria-hidden': 'true' }, [Object.assign(document.createElementNS('http://www.w3.org/2000/svg', 'svg'), { innerHTML: '<path d="M3 4.5l1.5 1.5L7 3.5M3 10.5l1.5 1.5L7 9.5M9.5 5h4M9.5 11h4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>' })]),
          ...(count ? [el('b', { class: 'rl-todo-btn-badge', text: String(count) })] : []),
        ] : [
          el('span', { class: 'rl-todo-btn-tag', text: '待办' }),
          el('span', { class: 'rl-todo-btn-n', text: String(count) }),
          el('span', { class: 'rl-todo-btn-sub', text: groups.running.length ? `${groups.running.length} 个运行中` : '' }),
          el('i', { class: 'rl-todo-btn-pip' }),
        ])
      trigger.querySelector('svg')?.setAttribute('viewBox', '0 0 16 16')
      foot.append(trigger)
      if (mode === 'bar' && !params.has('nobill')) {
        foot.append(el('div', { class: 'rl-bill', 'data-state': 'ready' }, [
          el('div', { class: 'rl-bill-row rl-bill-row--cost' }, [el('span', { class: 'rl-bill-k', text: '本会话' }), el('span', { class: 'rl-bill-v', text: '¥0.042' })]),
          el('div', { class: 'rl-bill-row rl-bill-row--balance' }, [el('span', { class: 'rl-bill-k', text: '余额' }), el('span', { class: 'rl-bill-v', text: '¥12.30' })]),
          el('span', { class: 'rl-bill-tag', text: '闲时' }),
        ]))
      }

      if (!params.has('closed')) {
        const sections = ['pending', 'done', 'running'].filter((kind) => groups[kind].length).map((kind) => el('section', { class: 'rl-todo-group', 'data-kind': kind }, [
          el('div', { class: 'rl-todo-gh' }, [el('i', { class: 'rl-todo-pip' }), el('span', { text: labels[kind] }), el('b', { text: String(groups[kind].length) })]),
          ...groups[kind].map((row) => el('button', { type: 'button', class: 'rl-todo-row', 'data-kind': kind, 'data-current': row.current ? 'true' : undefined }, [
            el('i', { class: 'rl-todo-bar' }),
            el('span', { class: 'rl-todo-main' }, [el('span', { class: 'rl-todo-name', title: row.title, text: row.title }), el('span', { class: 'rl-todo-status', text: row.status })]),
            el('span', { class: 'rl-todo-time', text: row.time }),
          ])),
        ]))
        const list = el('div', { class: 'rl-todo-list' }, sections.length ? sections : [el('div', { class: 'rl-todo-empty' }, [
          el('i', { class: 'rl-todo-pip' }), el('span', { class: 'rl-todo-empty-code', text: 'ALL CLEAR' }), el('span', { class: 'rl-todo-empty-text', text: '没有需要处理的对话' }),
        ])])
        const panel = el('div', { class: 'rl-todo-pop', role: 'dialog', 'aria-label': '待办', 'data-side': mode === 'rail' ? 'right' : 'top', tabindex: '-1' }, [
          el('div', { class: 'rl-todo-head' }, [el('span', { class: 'rl-todo-title', text: '待办' }), el('span', { class: 'rl-todo-code', text: 'RL · TODO' }), el('span', { class: 'rl-todo-sum', text: `${count} 项待处理` })]),
          list,
        ])
        // Same placement as TodoWidget.
        const rect = trigger.getBoundingClientRect()
        const side = mode === 'rail'
        panel.style.left = (side ? rect.right + 8 : Math.max(8, Math.min(rect.left, innerWidth - 328))) + 'px'
        panel.style.bottom = (side ? innerHeight - rect.bottom : innerHeight - rect.top + 8) + 'px'
        panel.style.setProperty('--rl-todo-max', Math.max(160, (side ? rect.bottom : rect.top) - 64) + 'px')
        document.body.append(panel)
      }

      if (!params.has('shot')) {
        const links = [['bar', '?mode=bar'], ['no billing', '?mode=bar&nobill'], ['rail', '?mode=rail'], ['empty', `?mode=${mode}&empty`], ['closed', `?mode=${mode}&closed`], ['dark', `${location.search}#dark`]]
        for (const [label, href] of links) document.getElementById('ctl').append(el('a', { href, text: label }))
        document.getElementById('ctl').lastChild.onclick = () => setTimeout(() => location.reload())
      }
      if (params.has('at')) {
        const at = Number(params.get('at'))
        requestAnimationFrame(() => { for (const animation of document.getAnimations()) { animation.pause(); animation.currentTime = at } })
      }
    })
  </script>
</body>
</html>
