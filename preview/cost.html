<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cost Page Preview</title>
  <style>
    /* Stand-ins for the app's tokens. The page itself is the real CostPage
       from lib/client.js, rendered with React and 62 days of sample data.
       URL: ?range=1|7|30|62  ?empty  ?nohours  ?nokey  ?nobudget  ?table
       ?pop renders the real billing card with costOpen "popup" and opens its
       panel (its chart opens the page)  ?side=0 hides the sidebar
       ?shot hides the controls  #dark */
    body {
      --dsw-font-family: -apple-system, "PingFang SC", sans-serif;
      --dsw-radius-xs: 2px; --dsw-radius-sm: 4px; --dsw-radius-md: 6px;
      --dsw-static-deepseek-500: #e46f24;
      --dsw-alias-bg-base: #fbfaf7;
      --dsw-alias-label-primary: #12110f; --dsw-alias-label-secondary: #5f5c56; --dsw-alias-label-tertiary: #949087;
      --dsw-alias-border-l1: rgba(18, 17, 15, .06); --dsw-alias-border-l2: rgba(18, 17, 15, .12); --dsw-alias-border-l3: rgba(18, 17, 15, .22);
      --dsw-alias-interactive-bg-hover: rgba(18, 17, 15, .05);
      --dsw-alias-state-error-primary: #d63a4f;
      --side: #f3f1ec;
      margin: 0; height: 100vh; background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary);
      font: 13px/1.5 var(--dsw-font-family);
    }
    body[data-ds-dark-theme] {
      --dsw-static-deepseek-500: #f0893e; --dsw-alias-bg-base: #1d1c1a;
      --dsw-alias-label-primary: #f6f5f1; --dsw-alias-label-secondary: #aca89e; --dsw-alias-label-tertiary: #7d7971;
      --dsw-alias-border-l1: rgba(255, 255, 255, .05); --dsw-alias-border-l2: rgba(255, 255, 255, .1); --dsw-alias-border-l3: rgba(255, 255, 255, .2);
      --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, .06);
      --side: #171614;
    }
    .app { display: flex; height: 100vh; }
    .side { flex: none; width: 260px; display: flex; flex-direction: column; background: var(--side); border-right: .5px solid var(--dsw-alias-border-l2); }
    .side ul { flex: 1; margin: 0; padding: 14px 8px; list-style: none; }
    .side li { padding: 6px 8px; color: var(--dsw-alias-label-secondary); white-space: nowrap; overflow: hidden; }
    .side .foot { display: flex; flex-wrap: wrap; }
    .main .idle { padding: 48px; color: var(--dsw-alias-label-tertiary); }
    .side .card { margin: 8px; padding: 8px 10px; border: .5px solid var(--dsw-alias-border-l3); border-radius: 6px; background: var(--dsw-alias-interactive-bg-hover); font: 600 9px/14px ui-monospace, monospace; letter-spacing: .16em; color: var(--dsw-alias-label-tertiary); }
    .main { flex: 1; min-width: 0; height: 100vh; }
    .ctl { position: fixed; right: 16px; bottom: 16px; z-index: 2000; display: flex; gap: 6px; }
    .ctl a { font: inherit; padding: 4px 10px; border: 1px solid var(--dsw-alias-border-l2); border-radius: 6px; background: var(--dsw-alias-bg-base); color: inherit; text-decoration: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div class="app">
    <aside class="side" id="side">
      <ul><li>重构计费模块</li><li>整理周报素材</li><li>翻译 README</li><li>数据清洗脚本</li></ul>
      <div class="foot" id="foot"><div class="card">RL · BILLING</div></div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div class="ctl" id="ctl"></div>
  <script>
    const params = new URLSearchParams(location.search)
    if (location.hash === '#dark') document.body.setAttribute('data-ds-dark-theme', '')
    if (params.get('side') === '0') document.getElementById('side').remove()

    // Deterministic sample data: 62 days, three workspaces, one deleted conversation.
    let seed = 7
    const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647
    const pad = (n) => String(n).padStart(2, '0')
    const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`
    const rates = { 'deepseek-v4-flash': { hit: 0.04, miss: 2, out: 8 }, 'deepseek-v4-pro': { hit: 0.3, miss: 9, out: 27 }, 'deepseek-v3.2': { hit: 0.2, miss: 2, out: 3 } }
    const convs = [
      ['s01', '重构计费模块的预算提醒逻辑', 'Deepseek Theme'], ['s02', '推理强度滑块点阵特效', 'Deepseek Theme'], ['s03', '整理周报素材', 'default-workspace'],
      ['s04', '翻译 README 到英文', 'Deepseek Theme'], ['s05', '数据清洗脚本', 'data-lab'], ['s06', '开屏退场动画调试', 'Deepseek Theme'],
      ['s07', '订单表去重与异常值', 'data-lab'], ['s08', '会议纪要汇总', 'default-workspace'], ['s09', '待办中心交互走查', 'Deepseek Theme'],
      ['s10', 'SQL 慢查询分析', 'data-lab'], ['s11', '归档对话删除逻辑', 'Deepseek Theme'], ['gone', null, null]
    ]
    const days = {}, ledgers = {}
    const now = new Date()
    if (!params.has('empty')) for (let back = 61; back >= 0; back--) {
      const d = new Date(now); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - back)
      const weekend = d.getDay() === 0 || d.getDay() === 6
      if (rand() < (weekend ? 0.45 : 0.08)) continue
      const scale = (weekend ? 0.4 : 1) * (0.5 + rand()) * (back < 20 ? 1.4 : 1)
      const row = { models: {}, sessions: {} }
      const withHours = !params.has('nohours') && back < 18
      if (withHours) { row.hours = Array(24).fill(0); row.peak = 0; row.offPeak = 0 }
      for (const model of ['deepseek-v4-flash', 'deepseek-v4-pro', 'deepseek-v3.2']) {
        if (model === 'deepseek-v4-pro' && rand() < 0.35) continue
        if (model === 'deepseek-v3.2' && (back > 40 || rand() < 0.75)) continue
        const k = model === 'deepseek-v4-flash' ? 1 : model === 'deepseek-v4-pro' ? 0.25 : 0.4
        const t = { miss: 4e5 * scale * k * (0.6 + rand()), hit: 3.2e6 * scale * k * (0.6 + rand()), out: 1.1e5 * scale * k * (0.6 + rand()) }
        const r = rates[model], factor = 0.55 + rand() * 0.45
        const cost = (t.miss * r.miss + t.hit * r.hit + t.out * r.out) / 1e6 * factor
        row.models[model] = { cost, ...t }
        const pick = convs[Math.floor(rand() * (back > 30 ? convs.length : convs.length - 1))][0]
        row.sessions[pick] = (row.sessions[pick] || 0) + cost
        ledgers[pick] = { seen: { miss: 0, hit: 0, out: 0 }, cost: (ledgers[pick]?.cost || 0) + cost, currency: 'CNY', model, at: d.getTime() }
        if (withHours) {
          const off = cost * (1 - factor) * 2
          row.offPeak += Math.min(cost, off); row.peak += cost - Math.min(cost, off)
          for (let i = 0; i < 6; i++) { const h = [10, 11, 15, 16, 21, 23, 9, 14][Math.floor(rand() * 8)]; row.hours[h] += cost / 6 }
        }
      }
      days[key(d)] = row
    }
    localStorage.setItem('rhine-splash:bill-days', JSON.stringify({ v: 1, currency: 'CNY', days }))
    for (const [id, ledger] of Object.entries(ledgers)) localStorage.setItem('rhine-splash:bill:' + id, JSON.stringify(ledger))
    if (params.has('range')) localStorage.setItem('rhine-splash:cost-range', params.get('range'))

    const realFetch = window.fetch
    window.fetch = (url, init) => String(url).includes('/rhine-splash/balance')
      ? Promise.resolve({ ok: true, json: async () => params.has('nokey') ? { status: 'no-key' } : { status: 'ready', available: true, balances: [{ currency: 'CNY', total: '86.20', granted: '10.00', toppedUp: '76.20' }] } })
      : realFetch(url, init)
    globalThis.__RHINE_SPLASH__ = { costOpen: params.has('pop') ? 'popup' : 'page', billing: true, uiTheme: true, brand: true, accent: 'rhine', base: 'warm', budgetDaily: params.has('nobudget') ? 0 : 6, budgetSession: params.has('nobudget') ? 0 : 3, todoCenter: true, rowStatus: true }
    globalThis.__RHINE_BRAND__ = {}

    // Load lib/client.js through a minimal module loader.
    let factory
    window.__ModuleLoader__ = { load: (definition) => { factory = definition.factory } }
    const jsx = (type, props, key) => React.createElement(type, key === undefined ? props : { ...props, key })
    const P = new Proxy({}, { get: () => () => null })
    const modules = { react: React, 'react-dom': ReactDOM, 'react/jsx-runtime': { jsx, jsxs: jsx, Fragment: React.Fragment }, '@deepseek-ai/dsh-client-ui-primitives': P }
    const store = (value) => ({ getSnapshot: () => value, subscribe: () => () => {} })
    realFetch('../lib/client.js').then((r) => r.text()).then((src) => {
      const body = src.slice(src.indexOf('const CSS = [') + 'const CSS = '.length, src.indexOf('].join("");') + 1)
      const style = document.createElement('style')
      style.textContent = new Function(`return ${body}`)().join('')
      document.head.append(style)
      new Function(src)()
      const { internals } = factory((name) => modules[name])
      const t = (k) => internals.zh[k] ?? k
      const titles = Object.fromEntries(convs.filter(([id]) => id !== 'gone').map(([id, title, ws]) => [id, { title, cwd: '/Users/me/' + ws, updatedAt: ledgers[id]?.at ?? Date.now() }]))
      const spaces = ['Deepseek Theme', 'default-workspace', 'data-lab'].map((title, i) => ({ workspaceId: 'w' + i, title, path: '/Users/me/' + title, sessionIds: convs.filter((c) => c[2] === title).map((c) => c[0]) }))
      const props = {
        t, sessions: { list: store({ phase: 'ready', byId: titles }) }, workspaces: { list: store({ items: spaces, archivedSessionIds: [] }) },
        open: (id) => console.log('open', id), saveSetting: async (field, value) => console.log('save', field, value),
        getNavigation: () => ({ openBundle: () => console.log('settings') }), back: () => console.log('back')
      }
      if (!params.has('pop')) ReactDOM.createRoot(document.getElementById('main')).render(React.createElement(internals.CostPage, props))
      else {
        // The billing card in the sidebar; the main area shows the page once it is selected.
        let panel = { activePanelId: null }
        const listeners = new Set()
        const panelInfo = { getSnapshot: () => panel, subscribe: (fn) => { listeners.add(fn); return () => listeners.delete(fn) } }
        const layout = { panelInfo, selectPanel: (id) => { panel = { activePanelId: id }; listeners.forEach((fn) => fn()) } }
        const Main = () => React.useSyncExternalStore(panelInfo.subscribe, panelInfo.getSnapshot).activePanelId === 'rhine-cost'
          ? React.createElement(internals.CostPage, { ...props, back: () => layout.selectPanel(null) })
          : React.createElement('p', { className: 'idle' }, '对话区域')
        ReactDOM.createRoot(document.getElementById('main')).render(React.createElement(Main))
        const card = { ...props, wide: true, layout, selection: store({ sessionId: 's02' }) }
        ReactDOM.createRoot(document.getElementById('foot')).render(React.createElement(internals.BillingWidget, card))
        setTimeout(() => document.querySelector('.rl-bill')?.click(), 120)
      }
      if (params.has('table')) setTimeout(() => [...document.querySelectorAll('.rl-cp-toggle button')].at(-1)?.click(), 50)
    })

    if (!params.has('shot')) {
      const ctl = document.getElementById('ctl')
      for (const [label, href] of [['今日', '?range=1'], ['7 天', '?range=7'], ['30 天', '?range=30'], ['62 天', '?range=62'], ['空', '?empty'], ['小卡片', '?pop'], ['深色', location.search + (location.hash === '#dark' ? '' : '#dark')]]) {
        const a = document.createElement('a'); a.textContent = label; a.href = href; ctl.append(a)
        if (label === '深色') a.addEventListener('click', () => setTimeout(() => location.reload()))
      }
    }
  </script>
</body>
</html>
