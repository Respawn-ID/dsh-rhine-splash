<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cost Preview</title>
  <style>
    /* Stand-ins for the app's tokens, so the cost panel styles from
       lib/client.js render as in the app. The markup mirrors BillingWidget.
       URL: ?range=30  ?empty  ?editing  ?peak  ?closed  ?at=<ms> freezes
       every animation at that time  ?shot hides the controls  #dark */
    body {
      --dsw-font-family: -apple-system, "PingFang SC", sans-serif;
      --dsw-radius-xs: 2px; --dsw-radius-sm: 4px; --dsw-radius-md: 6px;
      --dsw-static-deepseek-500: #e46f24;
      --dsw-alias-bg-base: #fbfaf7;
      --dsw-alias-label-primary: #12110f; --dsw-alias-label-secondary: #5f5c56; --dsw-alias-label-tertiary: #949087;
      --dsw-alias-border-l1: rgba(18, 17, 15, .06); --dsw-alias-border-l2: rgba(18, 17, 15, .12); --dsw-alias-border-l3: rgba(18, 17, 15, .22);
      --dsw-alias-interactive-bg-hover: rgba(18, 17, 15, .05);
      --dsw-alias-state-error-primary: #d63a4f;
      --side: #f3f1ec;
      margin: 0; height: 100vh; background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary);
      font: 13px/1.5 var(--dsw-font-family);
    }
    body[data-ds-dark-theme] {
      --dsw-static-deepseek-500: #f0893e; --dsw-alias-bg-base: #1d1c1a;
      --dsw-alias-label-primary: #f6f5f1; --dsw-alias-label-secondary: #aca89e; --dsw-alias-label-tertiary: #7d7971;
      --dsw-alias-border-l1: rgba(255, 255, 255, .05); --dsw-alias-border-l2: rgba(255, 255, 255, .1); --dsw-alias-border-l3: rgba(255, 255, 255, .2);
      --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, .06);
      --side: #171614;
    }
    .app { display: flex; height: 100vh; }
    .side { flex: none; width: 260px; display: flex; flex-direction: column; background: var(--side); border-right: .5px solid var(--dsw-alias-border-l2); }
    .side ul { flex: 1; margin: 0; padding: 14px 8px; list-style: none; }
    .side li { padding: 6px 8px; color: var(--dsw-alias-label-secondary); white-space: nowrap; overflow: hidden; }
    .foot { display: flex; width: 100%; }
    .settings { height: 36px; border-top: .5px solid var(--dsw-alias-border-l2); }
    .main { position: relative; flex: 1; background: url(../assets/bars-light.jpg) right center / cover; }
    body[data-ds-dark-theme] .main { background-image: url(../assets/bars-dark.jpg); }
    .main p { position: absolute; left: 48px; top: 120px; width: 460px; margin: 0; font-size: 15px; line-height: 1.7; color: var(--dsw-alias-label-secondary); }
    .ctl { position: fixed; right: 16px; top: 16px; z-index: 2000; display: flex; gap: 6px; }
    .ctl a { font: inherit; padding: 4px 10px; border: 1px solid var(--dsw-alias-border-l2); border-radius: 6px; color: inherit; text-decoration: none; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <ul><li>重构计费模块</li><li>整理周报素材</li><li>翻译 README</li><li>数据清洗脚本</li></ul>
      <div class="foot" id="foot"></div>
      <div class="settings"></div>
    </aside>
    <main class="main"><p>莱茵生命 · 研究档案 RL-DSH/0.2 · 终端已就绪。这段文字和板条阵列只是为了让费用面板背后有内容，便于检查毛玻璃的透明与模糊效果。DEEPSEEK HARNESS INTERNAL TERMINAL</p></main>
  </div>
  <div class="ctl" id="ctl"></div>
  <script>
    const params = new URLSearchParams(location.search)
    const range = params.get('range') === '30' ? 30 : 7
    const empty = params.has('empty')
    const peak = params.has('peak')
    if (location.hash === '#dark') document.body.setAttribute('data-ds-dark-theme', '')
    const money = (v) => '¥' + v.toFixed(v < 0.01 ? 4 : v < 1 ? 3 : 2)
    // Sample spending, deterministic so screenshots stay stable.
    const days = Array.from({ length: range }, (_, i) => empty ? 0 : Math.max(0, Math.round((Math.sin(i * 1.7) * 0.5 + 0.6 + (i % 5) * 0.12) * 100) / 100 * (i === range - 1 ? 1.4 : 1)))
    const today = days[days.length - 1], total = days.reduce((a, b) => a + b, 0), max = Math.max(...days)
    const el = (tag, attrs = {}, children = []) => {
      const node = document.createElement(tag)
      for (const [key, value] of Object.entries(attrs)) {
        if (value === undefined) continue
        if (key === 'text') node.textContent = value
        else if (key === 'style') for (const [p, v] of Object.entries(value)) node.style.setProperty(p, v)
        else node.setAttribute(key, value)
      }
      node.append(...children)
      return node
    }
    // Pull the CSS array straight out of lib/client.js so this page never
    // drifts from the shipped styles.
    fetch('../lib/client.js').then((r) => r.text()).then((src) => {
      const css = src.slice(src.indexOf('const CSS = [') + 'const CSS = '.length, src.indexOf('].join("");') + 1)
      const style = document.createElement('style')
      style.textContent = new Function(`return ${css}`)().join('')
      document.head.append(style)

      const foot = document.getElementById('foot')
      foot.append(el('button', { type: 'button', class: 'rl-todo-btn', 'data-mode': 'bar', 'data-tone': 'idle' }, [
        el('span', { class: 'rl-todo-btn-tag', text: '待办' }), el('span', { class: 'rl-todo-btn-n', text: '0' }),
        el('span', { class: 'rl-todo-btn-sub', text: '' }), el('i', { class: 'rl-todo-btn-pip' }),
      ]))
      const card = el('div', { class: 'rl-bill', role: 'button', tabindex: '0', 'aria-haspopup': 'dialog', 'aria-label': '打开费用面板',
        'data-state': 'ready', 'data-peak': peak ? 'true' : undefined, 'data-open': params.has('closed') ? undefined : 'true' }, [
        el('div', { class: 'rl-bill-row rl-bill-row--cost' }, [el('span', { class: 'rl-bill-k', text: '本对话' }), el('span', { class: 'rl-bill-v', text: empty ? '—' : '¥0.042' })]),
        el('div', { class: 'rl-bill-row rl-bill-row--balance' }, [el('span', { class: 'rl-bill-k', text: '余额' }), el('span', { class: 'rl-bill-v', text: '¥12.30' })]),
        el('span', { class: 'rl-bill-tag', text: peak ? '高峰' : '闲时' }),
      ])
      foot.append(card)
      if (params.has('closed')) return finish()

      const models = empty ? [] : [{ model: 'deepseek-flash', cost: total * 0.76, share: 0.76 }, { model: 'deepseek-v4-pro', cost: total * 0.24, share: 0.24 }]
      const convs = empty ? [] : [['重构计费模块', 3.12], ['整理周报素材', 1.04], ['翻译 README', 0.62], ['数据清洗脚本', 0.31]]
      const budget = (label, limit, spent, editing) => {
        const state = limit === 0 ? 'off' : spent >= limit ? 'over' : spent >= 0.8 * limit ? 'warn' : 'ok'
        return el('div', { class: 'rl-cost-budget', 'data-state': state }, [
          el('div', { class: 'rl-cost-row' }, [
            el('span', { class: 'rl-cost-name', text: label }),
            editing ? el('input', { class: 'rl-cost-input', type: 'text', inputmode: 'decimal', value: String(limit) })
              : el('button', { type: 'button', class: 'rl-cost-limit', title: '修改上限', text: limit ? '上限 ' + money(limit) : '未设置' }),
            el('span', { class: 'rl-cost-pct', text: limit ? Math.round(spent / limit * 100) + '%' : '' }),
          ]),
          el('div', { class: 'rl-cost-track' }, [el('i', { style: { '--w': String(limit ? Math.min(1, spent / limit) : 0) } })]),
        ])
      }
      const rangeLabel = range === 7 ? '近 7 天' : '近 30 天'
      const label = (text) => el('div', { class: 'rl-cost-sec-label', text })
      const body = el('div', { class: 'rl-cost-body' }, [
        el('div', { class: 'rl-cost-tiles' }, [
          el('div', { class: 'rl-cost-tile', 'data-kind': 'session' }, [el('span', { class: 'rl-cost-k', text: '本对话' }), el('b', { class: 'rl-cost-v', text: empty ? '—' : '¥0.042' })]),
          el('div', { class: 'rl-cost-tile', 'data-kind': 'today' }, [el('span', { class: 'rl-cost-k', text: '今日' }), el('b', { class: 'rl-cost-v', text: money(today) })]),
          el('div', { class: 'rl-cost-tile', 'data-kind': 'range' }, [el('span', { class: 'rl-cost-k', text: rangeLabel }), el('b', { class: 'rl-cost-v', text: money(total) })]),
        ]),
        ...(empty ? [el('p', { class: 'rl-cost-empty', text: '还没有记录' })] : [
          el('div', { class: 'rl-cost-chart-head' }, [
            el('span', { class: 'rl-cost-sec-label', text: rangeLabel + '每日花费' }),
            el('div', { class: 'rl-cost-range', role: 'group' }, [
              el('button', { type: 'button', 'aria-pressed': String(range === 7), text: '7 天' }),
              el('button', { type: 'button', 'aria-pressed': String(range === 30), text: '30 天' }),
            ]),
          ]),
          el('div', { class: 'rl-cost-chart', 'data-range': String(range), role: 'img' },
            days.map((cost, i) => el('i', { class: 'rl-cost-bar', style: { '--h': String(max ? cost / max : 0) }, 'data-today': i === days.length - 1 ? 'true' : undefined, title: money(cost) }))),
          el('div', { class: 'rl-cost-axis' }, [el('span', { text: range === 7 ? '10/15' : '9/22' }), el('span', { text: '今日' })]),
          el('section', { class: 'rl-cost-sec' }, [label('按模型'), ...models.flatMap((m) => [
            el('div', { class: 'rl-cost-row', title: '未命中 1,204,880 · 命中 9,876,000 · 输出 412,300' }, [el('span', { class: 'rl-cost-name', text: m.model }), el('span', { class: 'rl-cost-amt', text: money(m.cost) })]),
            el('div', { class: 'rl-cost-track' }, [el('i', { style: { '--w': String(m.share) } })]),
          ])]),
          el('section', { class: 'rl-cost-sec' }, [label('花费最多的对话（累计）'), ...convs.map(([name, cost]) =>
            el('button', { type: 'button', class: 'rl-cost-conv' }, [el('span', { class: 'rl-cost-name', text: name }), el('span', { class: 'rl-cost-amt', text: money(cost) })]))]),
        ]),
        el('section', { class: 'rl-cost-sec rl-cost-budgets' }, [label('预算'),
          budget('今日', empty ? 0 : 10, today, params.has('editing')),
          budget('本对话', empty ? 0 : 0.05, 0.042, false),
        ]),
      ])
      const panel = el('div', { class: 'rl-cost-pop', role: 'dialog', 'aria-label': '费用', tabindex: '-1' }, [
        el('div', { class: 'rl-cost-head' }, [
          el('span', { class: 'rl-cost-title', text: '费用' }), el('span', { class: 'rl-cost-code', text: 'RL · BILLING' }),
          el('span', { class: 'rl-cost-period', 'data-peak': peak ? 'true' : undefined, text: peak ? '高峰' : '闲时 · 半价' }),
        ]),
        body,
        el('div', { class: 'rl-cost-foot' }, [
          el('span', { class: 'rl-cost-balance', title: '赠送 ¥2.00 · 充值 ¥10.30', text: '余额 ¥12.30' }),
          el('button', { type: 'button', class: 'rl-cost-settings', text: '设置' }),
        ]),
        el('p', { class: 'rl-cost-note', text: '按官方价格估算，闲时半价；仅统计本机记录，按天统计从本版本开始。' }),
      ])
      // Same placement as BillingWidget.
      const rect = card.getBoundingClientRect()
      panel.style.left = Math.max(8, Math.min(rect.left, innerWidth - 348)) + 'px'
      panel.style.bottom = (innerHeight - rect.top + 8) + 'px'
      panel.style.setProperty('--rl-cost-max', Math.max(200, rect.top - 64) + 'px')
      document.body.append(panel)
      finish()
    })
    function finish() {
      if (!params.has('shot')) {
        const links = [['7 天', '?range=7'], ['30 天', '?range=30'], ['编辑预算', '?editing'], ['高峰', '?peak'], ['空', '?empty'], ['收起', '?closed'], ['深色', `${location.search}#dark`]]
        for (const [text, href] of links) document.getElementById('ctl').append(el('a', { href, text }))
        document.getElementById('ctl').lastChild.onclick = () => setTimeout(() => location.reload())
      }
      if (params.has('at')) {
        const at = Number(params.get('at'))
        requestAnimationFrame(() => { for (const animation of document.getAnimations()) { animation.pause(); animation.currentTime = at } })
      }
    }
  </script>
</body>
</html>
