<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Billing Preview</title>
  <style>
    /* Stand-ins for the app's tokens under the Rhine theme, so the widget
       styles from lib/client.js render here as they do in the app. */
    body {
      --dsw-font-family: -apple-system, "PingFang SC", sans-serif;
      --dsw-radius-sm: 4px; --dsw-radius-md: 6px; --dsw-radius-lg: 8px;
      --dsw-static-deepseek-500: #e46f24;
      --dsw-alias-label-primary: #12110f; --dsw-alias-label-secondary: #5f5c56; --dsw-alias-label-tertiary: #949087;
      --dsw-alias-border-l2: rgba(18, 17, 15, .12);
      margin: 0; padding: 24px; background: #f2f1ec; color: var(--dsw-alias-label-primary);
      font: 13px/1.6 var(--dsw-font-family);
    }
    body[data-ds-dark-theme] {
      --dsw-alias-label-primary: #f6f5f1; --dsw-alias-label-secondary: #aca89e; --dsw-alias-label-tertiary: #7d7971;
      --dsw-alias-border-l2: rgba(255, 255, 255, .1);
      background: #171715;
    }
    .grid { display: flex; gap: 24px; align-items: flex-end; }
    .side { width: 248px; display: flex; flex-direction: column; gap: 8px; }
    .side > b { font-size: 11px; letter-spacing: .08em; opacity: .5; }
    .foot { display: flex; padding: 4px 0; border-top: 1px solid var(--dsw-alias-border-l2); }
    .settings { padding: 6px 12px; font-size: 13px; color: var(--dsw-alias-label-secondary); }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script>
    if (location.hash === '#dark') document.body.setAttribute('data-ds-dark-theme', '')
    // Pull the CSS array straight out of lib/client.js so this page never drifts.
    fetch('../lib/client.js').then((r) => r.text()).then((src) => {
      const body = src.slice(src.indexOf('const CSS = [') + 'const CSS = '.length, src.indexOf('].join("");') + 1)
      const style = document.createElement('style')
      style.textContent = new Function(`return ${body}`)().join('')
      document.head.append(style)
      const widget = ({ label, peak, state, cost, balance }) => `
        <div class="side"><b>${label}</b>
          <div class="foot"><div class="rl-bill" ${peak ? 'data-peak="true"' : ''} data-state="${state}">
            <div class="rl-bill-row rl-bill-row--cost"><span class="rl-bill-k">本对话</span><span class="rl-bill-v">${cost}</span></div>
            <div class="rl-bill-row rl-bill-row--balance"><span class="rl-bill-k">余额</span><span class="rl-bill-v">${balance}</span></div>
            <span class="rl-bill-tag">${peak ? '高峰' : '闲时'}</span>
          </div></div>
          <div class="settings">设置</div>
        </div>`
      document.getElementById('grid').innerHTML = [
        { label: '闲时 · 正常', peak: false, state: 'ready', cost: '¥0.0347', balance: '¥95.40' },
        { label: '高峰 · 正常', peak: true, state: 'ready', cost: '¥1.268', balance: '¥94.17' },
        { label: '未配置 Key', peak: false, state: 'no-key', cost: '—', balance: '未配置 Key' },
      ].map(widget).join('')
    })
  </script>
</body>
</html>
