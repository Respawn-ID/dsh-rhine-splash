<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brand Preview</title>
  <style>
    /* Stand-ins for the app's original tokens, so the theme overrides below
       can be compared against them. */
    .orig { --dsw-static-deepseek-500: #4176e6; --dsw-alias-bg-base: #fff; --dsw-alias-label-primary: #0f1115; --dsw-font-family-brand: "Montserrat", -apple-system, sans-serif; }
    .orig.dark { --dsw-static-deepseek-500: #5686fe; --dsw-alias-bg-base: #151517; --dsw-alias-label-primary: #f9fafb; }
    .rhine { --dsw-static-deepseek-500: #e46f24; --dsw-alias-bg-base: #fbfaf7; --dsw-alias-label-primary: #12110f; --dsw-font-family-brand: "Montserrat", -apple-system, sans-serif; }
    .rhine.dark { --dsw-static-deepseek-500: #f0893e; --dsw-alias-bg-base: #171715; --dsw-alias-label-primary: #f6f5f1; }
    body { margin: 0; font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; background: #e9e8e4; color: #222; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 16px; }
    .card { padding: 20px; background: var(--dsw-alias-bg-base); color: var(--dsw-alias-label-primary); border-radius: 12px; }
    .card h2 { margin: 0 0 14px; font-size: 11px; font-weight: 600; letter-spacing: .12em; opacity: .55; }
    .side { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--dsw-alias-label-primary) 5%, transparent); }
    .hero { display: flex; align-items: center; gap: 12px; margin-top: 18px; font-size: 22px; font-weight: 600; }
    .rl-brand { display: inline-flex; }
    .rl-brand-mark { width: 24px; height: 24px; }
    .rl-brand-hero { width: 34px; height: 34px; }
    .big { display: flex; gap: 22px; align-items: center; margin-top: 18px; }
    .big .rl-brand { width: 96px; height: 96px; }
    .swatches { display: flex; gap: 4px; margin-top: 16px; }
    .swatches i { width: 22px; height: 22px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="grid" id="cands"></div>
  <script>
    const cands = [['../lib/brand/mark-plate.svg', 'plate 模块铭牌'], ['../lib/brand/mark-cell.svg', 'cell 开放细胞']]
    Promise.all(cands.map(([f]) => fetch(f).then((r) => r.text()))).then((svgs) => fetch('../lib/brand/name.html').then((r) => r.text()).then((name) => {
      document.getElementById('cands').innerHTML = ['rhine', 'rhine dark', 'orig', 'orig dark'].map((cls) => `
        <div class="card ${cls}"><h2>Logo 方案 · ${cls.startsWith('rhine') ? '莱茵主题' : '原版配色'} · ${cls.includes('dark') ? '深色' : '浅色'}</h2>
        ${svgs.map((svg, i) => `
          <div style="display:flex;align-items:center;gap:18px;margin:10px 0 16px">
            <b style="width:86px;font-size:11px;letter-spacing:.06em;opacity:.6">${cands[i][1]}</b>
            <span class="side" style="flex:none"><span class="rl-brand rl-brand-mark">${svg}</span><span class="rl-brand">${name}</span></span>
            <span class="rl-brand" style="width:34px;height:34px">${svg}</span>
            <span class="rl-brand" style="width:72px;height:72px">${svg}</span>
          </div>`).join('')}
        </div>`).join('')
    }))
  </script>
</body>
</html>
